# Native 640x544 ROS bag model for OpenExplore v1.2.6 / hb_mapper 1.23.8.
model_parameters:
  onnx_model: '../artifacts/xfeat_backbone_544x640_opset11.onnx'
  march: 'bayes-e'
  layer_out_dump: false
  working_dir: '../artifacts/model_output/xfeat_backbone_544x640_bayes_e'
  output_model_file_prefix: 'xfeat_backbone_544x640_bayes_e'

input_parameters:
  input_name: 'image'
  input_shape: '1x1x544x640'
  input_type_rt: 'featuremap'
  input_layout_rt: 'NCHW'
  input_type_train: 'featuremap'
  input_layout_train: 'NCHW'
  norm_type: 'no_preprocess'

calibration_parameters:
  cal_data_dir: '../calibration_data/bag_2026-06-05-09-59-04_544x640'
  cal_data_type: 'float32'
  calibration_type: 'default'
  preprocess_on: false

compiler_parameters:
  compile_mode: 'latency'
  debug: false
  optimize_level: 'O3'
