model_parameters:
  onnx_model: '../models/xfeat_fine_matcher_m384.onnx'
  march: 'bayes-e'
  layer_out_dump: false
  working_dir: '../artifacts/model_output/xfeat_fine_matcher_m384_bayes_e'
  output_model_file_prefix: 'xfeat_fine_matcher_m384_bayes_e'
input_parameters:
  input_name: 'descriptor_pairs'
  input_shape: '1x384x128'
  input_type_rt: 'featuremap'
  input_layout_rt: 'NCHW'
  input_type_train: 'featuremap'
  input_layout_train: 'NCHW'
  norm_type: 'no_preprocess'
calibration_parameters:
  cal_data_dir: '../calibration_data/fine_matcher_m384'
  cal_data_type: 'float32'
  calibration_type: 'default'
  preprocess_on: false
compiler_parameters:
  compile_mode: 'latency'
  debug: false
  optimize_level: 'O3'
