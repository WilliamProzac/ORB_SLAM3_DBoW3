%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

# Camera calibration and distortion parameters (OpenCV) 
# 基于 camera_info 的参数
Camera1.fx: 914.081665
Camera1.fy: 912.610229
Camera1.cx: 644.047913
Camera1.cy: 362.840881

# [新增] 畸变参数 (默认设为0，建议使用 rectified 话题)
Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0

Camera.width: 1280
Camera.height: 720
# Camera frames per second 
Camera.fps: 30
 
# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1
 
# Close/Far threshold. Baseline times.
Stereo.ThDepth: 40.0
Stereo.b: 0.0499585 # 基线长度 (与MyD435i.yaml一致)

# [新增] 深度图缩放因子 (RealSense 默认为 1000.0)
RGBD.DepthMapFactor: 1000.0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 1200
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 15
ORBextractor.minThFAST: 5

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0
 
# Map Load/Save Parameters
#--------------------------------------------------------------------------------------------
System.LoadAtlasFromFile: "rgbd_map.bin"
#System.SaveAtlasToFile: "rgbd_map.bin"
